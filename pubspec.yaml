name: skylist
description: SkyList modern Android music player built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  on_audio_query: ^2.9.0
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  just_audio_background: ^0.0.1-beta.17
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  collection: ^1.19.1

flutter:
  uses-material-design: true

dev_dependencies:
  flutter_lints: ^6.0.0
